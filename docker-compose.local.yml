# Override for localhost mode (HTTP on LOCALHOST_PORT)
# Use: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# Routing (entrypoint web = port 80 → exposed as LOCALHOST_PORT, default 7861):
#   /api/auth/*    → auth-service:3000 (priority 200; never send /api to main-app)
#   /api/company/* → plumoai-api:8080 (priority 100; company-api side, prefix stripped)
#   /api/v1/*      → plumoai-api:8080 (priority 150; public-api side, prefix kept)
#   /*             → main-app (priority 1, fallback for non-API only)
#
# Traefik starts with the stack and listens on LOCALHOST_PORT immediately.
# If /api/auth returns 404 on first request, wait ~30s for auth/company to register and retry.
#
# Lab: forwardedHeaders.insecure lets Traefik trust X-Forwarded-* from clients (OK for localhost).
# Production: use forwardedHeaders.trustedIPs for your real LB/CDN only (see main docker-compose Traefik comment).

services:
  traefik:
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.allowEmptyServices=true"
      # If a backend (e.g. company) doesn't send response headers in time, return 504 instead of buffering forever
      - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=60s"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.forwardedheaders.insecure=true"
      - "--entrypoints.websecure.forwardedheaders.insecure=true"
      # Define cert resolver so production routers (main/auth/api) don't error; localhost uses web (HTTP)
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=not-used@localhost"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
      # No HTTP→HTTPS redirect for localhost
    # !override replaces (not merges) ports - avoids binding to 80 on Windows
    ports: !override
      - "0.0.0.0:${LOCALHOST_PORT:-7861}:80"
      - "0.0.0.0:8080:8080"

  main-app:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.main.service=main"
      - "traefik.http.middlewares.sec-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.sec-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.sec-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.sec-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.ratelimit.ratelimit.average=200"
      - "traefik.http.middlewares.ratelimit.ratelimit.burst=100"
      # main-http: catch-all for non-API; auth (200) and api (100) take /api/* first
      - "traefik.http.routers.main-http.rule=PathPrefix(`/`)"
      - "traefik.http.routers.main-http.entrypoints=web"
      - "traefik.http.routers.main-http.priority=1"
      - "traefik.http.routers.main-http.service=main"
      - "traefik.http.routers.main-http.middlewares=sec-headers,ratelimit"
      - "traefik.http.services.main.loadbalancer.server.port=80"

  auth:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth-http.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.auth-http.entrypoints=web"
      - "traefik.http.routers.auth-http.priority=200"
      - "traefik.http.routers.auth-http.service=auth"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.auth-strip.stripprefix.prefixes=/api/auth"
      - "traefik.http.routers.auth-http.middlewares=auth-strip,sec-headers,ratelimit"

  # ai-service: use amd64 if you get "exec format error" on ARM (e.g. Windows on ARM)
  ai:
    platform: linux/amd64

  # plumoai-api now runs both company-api and public-api (single container, nginx on :8080)
  plumoai-api:
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.api-http.rule=PathPrefix(`/api/company`)"
      - "traefik.http.routers.api-http.entrypoints=web"
      - "traefik.http.routers.api-http.priority=100"
      - "traefik.http.routers.api-http.service=api"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api/company"
      - "traefik.http.routers.api-http.middlewares=api-strip,sec-headers,ratelimit"

      - "traefik.http.routers.plumoai-public-api-http.rule=PathPrefix(`/api/v1`)"
      - "traefik.http.routers.plumoai-public-api-http.entrypoints=web"
      - "traefik.http.routers.plumoai-public-api-http.priority=150"
      - "traefik.http.routers.plumoai-public-api-http.service=plumoai-public-api"
      - "traefik.http.services.plumoai-public-api.loadbalancer.server.port=8080"
      - "traefik.http.routers.plumoai-public-api-http.middlewares=sec-headers,ratelimit"
