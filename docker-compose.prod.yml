# Production overlay for PlumoAI
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This overlay adds production-specific configurations:
# - Strict resource limits
# - Health checks
# - Logging
# - Security headers

services:
  traefik:
    deploy:
      resources:
        limits: { memory: 256M }
        reservations: { memory: 64M }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  main-app:
    deploy:
      resources:
        limits: { memory: 512M }
        reservations: { memory: 128M }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  auth:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M
          cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  company:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
        reservations:
          memory: 128M
          cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ai:
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 256M }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    deploy:
      resources:
        limits: { memory: 1G }
        reservations: { memory: 256M }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
